# apphosting.yaml - Google Cloud App Hosting configuration
runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: BETTER_AUTH_URL
    value: https://www.starcast.online
  - variable: NEXT_PUBLIC_BASE_URL
    value: https://www.starcast.online
  - variable: DATABASE_URL
    secret: DATABASE_URL
  - variable: NEON_DATABASE_URL
    secret: DATABASE_URL
  - variable: BETTER_AUTH_SECRET
    secret: BETTER_AUTH_SECRET
  - variable: CRON_SECRET
    secret: CRON_SECRET
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
  - variable: PRINTIFY_API_TOKEN
    secret: PRINTIFY_API_TOKEN
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  - variable: GOOGLE_CLIENT_ID
    value: "815408657013-3tmce8kd7c5sm4naa9ak058l41e3o1a7.apps.googleusercontent.com"
  - variable: GOOGLE_CLIENT_SECRET
    secret: GOOGLE_CLIENT_SECRET

