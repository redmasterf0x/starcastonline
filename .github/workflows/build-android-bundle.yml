name: Build Android App Bundle (.aab)

on:
  push:
    branches: [ main ]
    paths:
      - 'starcast-mobile/**'
      - '.github/workflows/build-android-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build StarCast Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Native Android Platform Files
        working-directory: starcast-mobile
        run: |
          flutter create --org online.starcast --project-name starcast_mobile --platforms android .
          flutter pub get

      - name: Generate Android Release Keystore
        working-directory: starcast-mobile
        run: |
          mkdir -p android/app
          keytool -genkeypair -v \
            -keystore android/app/upload-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias starcastupload \
            -dname "CN=StarCast Online, OU=Mobile, O=StarCast Media, L=Los Angeles, ST=California, C=US" \
            -storepass "StarCastPass2026!" \
            -keypass "StarCastPass2026!"
          
          cat <<EOF > android/key.properties
          storePassword=StarCastPass2026!
          keyPassword=StarCastPass2026!
          keyAlias=starcastupload
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android App Bundle (.aab)
        working-directory: starcast-mobile
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: starcast-app-release-aab
          path: starcast-mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create GitHub Release with AAB
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: android-release-latest
          name: StarCast Android App Bundle (online.starcast.app)
          body: |
            ### StarCast Mobile Android App Bundle (.aab)
            - **Package Name:** `online.starcast.app`
            - **Signing Mode:** Release Mode (Signed with Release Keystore)
            - **Target:** Google Play Console Release
          files: starcast-mobile/build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
